name: TKMChat Android release

on:
  push:
    tags:
      - 'tkmchat-v*'

permissions:
  contents: write

concurrency:
  group: tkmchat-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Validate release signing configuration
        env:
          RELEASE_KEYSTORE: ${{ secrets.TKMCHAT_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.TKMCHAT_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.TKMCHAT_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.TKMCHAT_RELEASE_KEY_PASSWORD }}
          ZKGROUP_PARAMS: ${{ vars.TKMCHAT_ZKGROUP_SERVER_PUBLIC_PARAMS }}
          GENERIC_PARAMS: ${{ vars.TKMCHAT_GENERIC_SERVER_PUBLIC_PARAMS }}
          BACKUP_PARAMS: ${{ vars.TKMCHAT_BACKUP_SERVER_PUBLIC_PARAMS }}
          SEALED_SENDER_ROOT: ${{ vars.TKMCHAT_UNIDENTIFIED_SENDER_TRUST_ROOT }}
          SVR2_MRENCLAVE: ${{ vars.TKMCHAT_SVR2_MRENCLAVE }}
        run: |
          test -n "$RELEASE_KEYSTORE"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$ZKGROUP_PARAMS"
          test -n "$GENERIC_PARAMS"
          test -n "$BACKUP_PARAMS"
          test -n "$SEALED_SENDER_ROOT"
          test -n "$SVR2_MRENCLAVE"

      - name: Build release APKs
        env:
          TKMCHAT_SERVICE_URL: ${{ vars.TKMCHAT_SERVICE_URL }}
          TKMCHAT_STORAGE_URL: ${{ vars.TKMCHAT_STORAGE_URL }}
          TKMCHAT_CDN_URL: ${{ vars.TKMCHAT_CDN_URL }}
          TKMCHAT_CDN2_URL: ${{ vars.TKMCHAT_CDN2_URL }}
          TKMCHAT_CDN3_URL: ${{ vars.TKMCHAT_CDN3_URL }}
          TKMCHAT_CDSI_URL: ${{ vars.TKMCHAT_CDSI_URL }}
          TKMCHAT_SVR2_URL: ${{ vars.TKMCHAT_SVR2_URL }}
          TKMCHAT_SFU_URL: ${{ vars.TKMCHAT_SFU_URL }}
          TKMCHAT_STATUS_HOST: ${{ vars.TKMCHAT_STATUS_HOST }}
          TKMCHAT_CONTENT_PROXY_HOST: ${{ vars.TKMCHAT_CONTENT_PROXY_HOST }}
          TKMCHAT_CAPTCHA_URL: ${{ vars.TKMCHAT_CAPTCHA_URL }}
          TKMCHAT_RECAPTCHA_URL: ${{ vars.TKMCHAT_RECAPTCHA_URL }}
          TKMCHAT_ZKGROUP_SERVER_PUBLIC_PARAMS: ${{ vars.TKMCHAT_ZKGROUP_SERVER_PUBLIC_PARAMS }}
          TKMCHAT_GENERIC_SERVER_PUBLIC_PARAMS: ${{ vars.TKMCHAT_GENERIC_SERVER_PUBLIC_PARAMS }}
          TKMCHAT_BACKUP_SERVER_PUBLIC_PARAMS: ${{ vars.TKMCHAT_BACKUP_SERVER_PUBLIC_PARAMS }}
          TKMCHAT_UNIDENTIFIED_SENDER_TRUST_ROOT: ${{ vars.TKMCHAT_UNIDENTIFIED_SENDER_TRUST_ROOT }}
          TKMCHAT_SVR2_MRENCLAVE: ${{ vars.TKMCHAT_SVR2_MRENCLAVE }}
          TKMCHAT_FIREBASE_WEB_CLIENT_ID: ${{ vars.TKMCHAT_FIREBASE_WEB_CLIENT_ID }}
        run: ./gradlew :Signal-Android:assembleGithubProdRelease --max-workers=2 --stacktrace

      - name: Sign and verify APKs
        env:
          RELEASE_KEYSTORE: ${{ secrets.TKMCHAT_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.TKMCHAT_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.TKMCHAT_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.TKMCHAT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/tkmchat-release.jks"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          while IFS= read -r apk; do
            name="$(basename "$apk" .apk)"
            output="release/${name}-signed.apk"
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/tkmchat-release.jks" \
              --ks-pass "env:RELEASE_STORE_PASSWORD" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --key-pass "env:RELEASE_KEY_PASSWORD" \
              --out "$output" \
              "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$output"
          done < <(find app/build/outputs/apk/github/prod/release -type f -name '*.apk' | sort)
          test -n "$(find release -type f -name '*.apk' -print -quit)"
          sha256sum release/*.apk > release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS --verify-tag --generate-notes --title "TKMChat ${GITHUB_REF_NAME#tkmchat-v}"
