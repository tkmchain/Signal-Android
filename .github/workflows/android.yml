name: Android CI

on:
  pull_request:
  push:
    branches:
    - 'main'
    - '8.**'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gh api repos/actions/checkout/commits/v6 --jq '.sha'
      with:
          submodules: true
          lfs: true

    - name: set up JDK 21
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      # gh api repos/actions/setup-java/commits/v5 --jq '.sha'
      with:
        distribution: temurin
        java-version: 21

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      # gh api repos/gradle/actions/commits/v6 --jq '.sha'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      # gh api repos/gradle/actions/commits/v6 --jq '.sha'
      with:
        # Trusted branch builds populate the cache; pull requests remain read-only.
        cache-read-only: ${{ github.event_name == 'pull_request' }}
        # Required to persist the Gradle configuration cache across runs.
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    # Run the focused mailbox-registration tests before the larger app compilation. This gives
    # fast, actionable failures and avoids spending hosted-runner time after a failed unit test.
    - name: Test mailbox registration
      id: registration-tests
      continue-on-error: true
      env:
        SIGNAL_BUILD_CACHE_URL: ${{ secrets.SIGNAL_BUILD_CACHE_URL }}
        SIGNAL_BUILD_CACHE_USER: ${{ secrets.SIGNAL_BUILD_CACHE_USER }}
        SIGNAL_BUILD_CACHE_PASSWORD: ${{ secrets.SIGNAL_BUILD_CACHE_PASSWORD }}
        SIGNAL_BUILD_CACHE_PUSH: ${{ startsWith(github.ref, 'refs/heads/8.') }}
      run: |
        set -o pipefail
        ./gradlew :feature:registration:testDebugUnitTest --max-workers=2 2>&1 | tee registration-tests.log

    - name: Report registration test errors
      if: ${{ steps.registration-tests.conclusion == 'failure' }}
      run: |
        tail -n 200 registration-tests.log >> "$GITHUB_STEP_SUMMARY"
        awk '
          {
            lines[NR] = $0
            if (failed_test == 0 && $0 ~ / FAILED$/) failed_test = NR
            if (what_went_wrong == 0 && $0 ~ /^\* What went wrong:/) what_went_wrong = NR
          }
          END {
            start = failed_test > 0 ? failed_test : what_went_wrong
            for (i = start; i <= NR && emitted < 10; i++) {
              if (lines[i] == "") continue
              gsub(/%/, "%25", lines[i])
              gsub(/\r/, "%0D", lines[i])
              print "::error::" lines[i]
              emitted++
            }
          }
        ' registration-tests.log
        exit 1

    # Compile the enabled self-distributed release variant. The inherited qaRemote task builds and
    # lints every demo/benchmark module; tagged releases perform complete APK assembly separately.
    - name: Compile TKMChat release variant
      id: app-build
      continue-on-error: true
      env:
        SIGNAL_BUILD_CACHE_URL: ${{ secrets.SIGNAL_BUILD_CACHE_URL }}
        SIGNAL_BUILD_CACHE_USER: ${{ secrets.SIGNAL_BUILD_CACHE_USER }}
        SIGNAL_BUILD_CACHE_PASSWORD: ${{ secrets.SIGNAL_BUILD_CACHE_PASSWORD }}
        SIGNAL_BUILD_CACHE_PUSH: ${{ startsWith(github.ref, 'refs/heads/8.') }}
      run: |
        set -o pipefail
        ./gradlew \
          :Signal-Android:compileGithubProdReleaseKotlin \
          :Signal-Android:processGithubProdReleaseResources \
          --max-workers=2 2>&1 | tee app-build.log

    - name: Report app compilation errors
      if: ${{ steps.app-build.conclusion == 'failure' }}
      run: |
        tail -n 200 app-build.log >> "$GITHUB_STEP_SUMMARY"
        awk '
          {
            lines[NR] = $0
            if (what_went_wrong == 0 && $0 ~ /^\* What went wrong:/) what_went_wrong = NR
          }
          END {
            for (i = what_went_wrong; i <= NR && emitted < 10; i++) {
              if (lines[i] == "") continue
              gsub(/%/, "%25", lines[i])
              gsub(/\r/, "%0D", lines[i])
              print "::error::" lines[i]
              emitted++
            }
          }
        ' app-build.log
        exit 1

    - name: Archive reports for failed build
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      # gh api repos/actions/upload-artifact/commits/v7 --jq '.sha'
      with:
        name: reports
        path: |
          **/build/reports
          **/build/test-results
        if-no-files-found: ignore
